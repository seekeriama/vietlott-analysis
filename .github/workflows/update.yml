name: Cập nhật kết quả Vietlott
on:
  schedule:
    - cron: "30 12 * * *"   # 19:30 giờ Việt Nam
    - cron: "30 14 * * *"   # 21:30, chạy lại phòng khi kết quả đăng chậm
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-vietlott
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tải kết quả mới
        id: fetch
        run: python scripts/update.py
        continue-on-error: true
      - name: Lưu thay đổi
        run: |
          git config user.name "vietlott-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/vietlott.json
          git diff --cached --quiet || git commit -m "Cập nhật kết quả Vietlott"
          git push
      - name: Báo lỗi nếu không đọc được dữ liệu
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "Không đọc được kết quả từ xskt.com.vn, hãy xem log bước 'Tải kết quả mới'." >&2
          exit 1
